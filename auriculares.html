  owners.forEach(owner => {

      resumen[estado] = (resumen[estado] || 0) + 1;
    }
    let html = '<h3>Resumen por Estado</h3><ul>';
    for (let estado in resumen) {
      html += `<li><strong>${estado}:</strong> ${resumen[estado]}</li>`;
    }
    html += '</ul>';
    resumenDiv.innerHTML = html;
  }

  async function guardarEnSheetBest(data) {
    console.log('Guardando datos:', data);
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    const responseBody = await res.text();
    console.log('Respuesta de SheetBest (POST):', res.status, responseBody);
    if (!res.ok) throw new Error(`Error al guardar: ${res.status} - ${responseBody}`);
  }

  async function actualizarEnSheetBest(rowIndex, data) {
    const { id: _, ...updateData } = data; // Exclude 'id' from payload
    console.log('Actualizando datos en rowIndex:', rowIndex, updateData);
    const res = await fetch(`${API_URL}/${rowIndex}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(updateData)
    });
    const responseBody = await res.text();
    console.log('Respuesta de SheetBest (PATCH):', res.status, responseBody);
    if (!res.ok) throw new Error(`Error al actualizar: ${res.status} - ${responseBody}`);
  }

  async function cargarDesdeSheetBest() {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`Error al cargar datos: ${res.status}`);
      const data = await res.json();
      tabla.innerHTML = '';
      data.forEach((item, index) => {
        agregarFila(item, index + 2); // Rows start at 2 (1-based, plus header)
      });
      actualizarResumenEstados();
    } catch (err) {
      console.error('Error al cargar datos:', err);
      alert('Error al cargar datos: ' + err.message);
    }
  }

      type: document.getElementById('type').value,

      manufacturer: document.getElementById('manufacturer').value,
      model: document.getElementById('model').value,
      acquisitiondate: document.getElementById('acquisitiondate').value
    };

    try {
      if (!editId) {
